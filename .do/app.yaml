# DigitalOcean App Platform spec
# Deploys this repo as a Static Site (recommended — free, fastest).
#
# If you already created the app via the dashboard's autodetection,
# DO may have created a Node.js Web Service instead. In that case
# `npm start` (defined in package.json) will serve the built dist/
# directory on $PORT using the `serve` package, with SPA fallback
# configured via dist/serve.json.
#
# To switch an existing Web Service to a Static Site (recommended):
#   1. DO dashboard → your app → Settings → Components
#   2. Destroy the existing Service component
#   3. Create Component → Static Site → use this repo
#   4. Build command: npm ci && npm run build
#   5. Output directory: dist
#   6. Catchall document: index.html
#
# Or paste this spec into Settings → App Spec.

name: ir-dashboard-v6
region: fra
static_sites:
  - name: command-bar
    github:
      repo: aparatstyledevelopment/ir-dashboard-v6
      branch: claude/command-bar-dashboard-phase-1-dTi73
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: dist
    environment_slug: node-js
    catchall_document: index.html
    index_document: index.html
    routes:
      - path: /
